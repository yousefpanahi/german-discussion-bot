name: Telegram German Discussion Bot

permissions:
  contents: write

on:
  schedule:
    # Vocabulary — next day after each BBC episode
    # Sunday, Tuesday, Thursday — wait until 17:00 Tehran
    - cron: "17 10 * * 0,2,4"
    
    # Reminder — start early, wait until 17:00 Tehran
    - cron: "17 10 * * 1,3,6"

    # BBC intro unpin — 46 hours after BBC posting
    # Monday BBC -> Wednesday 20:00
    # Wednesday BBC -> Friday 20:00
    # Saturday BBC -> Monday 20:00
    - cron: "17 13 * * 1,3,5"

    # Join Class — start early, wait until 20:00 Tehran
    - cron: "47 15 * * 1,3,6"

    # BBC episode — start early, wait until 22:00 Tehran
    - cron: "17 15 * * 1,3,6"

  workflow_dispatch:
    inputs:
      message_type:
        description: "Which message do you want to test?"
        required: true
        type: choice
        options:
          - reminder
          - join
          - bbc
          - bbc_unpin
          - vocabulary

jobs:
  send-message:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      # ---------------------------------------
      # VOCABULARY — EXACTLY 17:00 TEHRAN
      # DAY AFTER EACH BBC EPISODE
      # ---------------------------------------

      - name: Send episode vocabulary
        if: |
          github.event.schedule == '17 10 * * 0,2,4' ||
          github.event.inputs.message_type == 'vocabulary'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_TYPE: vocabulary
          TARGET_TEHRAN_TIME: ${{ github.event_name == 'schedule' && '17:00' || '' }}
        run: python bot.py

      # ---------------------------------------
      # REMINDER — EXACTLY 17:00 TEHRAN
      # ---------------------------------------

      - name: Send reminder
        if: |
          github.event.schedule == '17 10 * * 1,3,6' ||
          github.event.inputs.message_type == 'reminder'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_TYPE: reminder
          TARGET_TEHRAN_TIME: ${{ github.event_name == 'schedule' && '18:00' || '' }}
        run: python bot.py


      # ---------------------------------------
      # BBC INTRO UNPIN — EXACTLY 20:00 TEHRAN
      # 46 HOURS AFTER BBC INTRO WAS PINNED
      # ---------------------------------------

      - name: Unpin BBC intro
        if: |
          github.event.schedule == '17 13 * * 1,3,5' ||
          github.event.inputs.message_type == 'bbc_unpin'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_TYPE: bbc_unpin
          TARGET_TEHRAN_TIME: ${{ github.event_name == 'schedule' && '21:00' || '' }}
        run: python bot.py


      # ---------------------------------------
      # JOIN CLASS — EXACTLY 20:00 TEHRAN
      # PIN FOR 3 HOURS
      # ---------------------------------------

      - name: Send join message
        if: |
          github.event.schedule == '47 15 * * 1,3,6' ||
          github.event.inputs.message_type == 'join'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_TYPE: join
          TARGET_TEHRAN_TIME: ${{ github.event_name == 'schedule' && '21:00' || '' }}
          UNPIN_DELAY_SECONDS: ${{ github.event_name == 'schedule' && '10800' || '20' }}
        run: python bot.py


      # ---------------------------------------
      # BBC EPISODE — EXACTLY 22:00 TEHRAN
      # ONLY THE INTRO MESSAGE IS PINNED
      # ---------------------------------------

      - name: Send BBC episode
        if: |
          github.event.schedule == '17 15 * * 1,3,6' ||
          github.event.inputs.message_type == 'bbc'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_TYPE: bbc
          TARGET_TEHRAN_TIME: ${{ github.event_name == 'schedule' && '23:00' || '' }}
        run: python bot.py


      # ---------------------------------------
      # SAVE BBC EPISODE + PINNED MESSAGE ID
      # ---------------------------------------

      - name: Save BBC state
        if: |
          always() &&
          (
            github.event.schedule == '17 15 * * 1,3,6' ||
            github.event.inputs.message_type == 'bbc' ||
            github.event.schedule == '17 13 * * 1,3,5' ||
            github.event.inputs.message_type == 'bbc_unpin' ||
            github.event.schedule == '17 10 * * 0,2,4' ||
            github.event.inputs.message_type == 'vocabulary'
          )

          
        run: |
          git config user.name "Telegram Discussion Bot"
          git config user.email "bot@users.noreply.github.com"

          git add episode_counter.txt
          git add bbc_pinned_message_id.txt 2>/dev/null || true

          git diff --cached --quiet || git commit -m "Update BBC episode and pin state"
          git push
